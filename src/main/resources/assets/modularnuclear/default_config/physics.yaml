physics:
  hu_per_degree: 32.0
  global_thermal_fission_multiplier: 1.53174
  global_fast_fission_multiplier: 1.0
  fast_absorption_damage_multiplier: 8.0
  thermal_absorption_damage_multiplier: 1.0
  fission_heat_per_neutron: 237.269
  # EU that plain steam makes of 1 HU: distilled water takes 17.65625 HU per litre and becomes 160 L of steam, which
  # a steam turbine at 100% efficiency turns into 1 EU per 2 L.  Radiovoltaic plates are measured against it.
  radiovoltaic_steam_eu_per_hu: 4.53097
  # A radiovoltaic plate reaches 95% of its output where it makes this many times what steam would of the heat it
  # absorbs.  A balance lever.
  radiovoltaic_efficiency_multiplier: 2.0
  grid_conduction_multiplier: 16.2569
  fuel_burnup_multiplier: 0.0437655
  neutron_yield_multiplier: 22.849
  # Share of fission_heat_per_neutron that a fuel's spontaneous emission deposits as prompt heat; its chain-reaction
  # emission deposits all of it. Lower values make the chain reaction, which control rods can stop, carry the heat.
  spontaneous_heat_fraction: 0.128857
  # Convective heat transfer of an MV (tier 2) high-pressure passage into its loop coolant, times
  # coolant_passage_heat_transfer_tier_ratio per voltage tier above. A passage's tier is its pipe material's (iron
  # LV, steel MV, stainless steel HV, titanium EV, tungstensteel IV, osmium LuV, neutronium ZPM). Both are calibrated.
  coolant_passage_heat_transfer_multiplier: 0.063606
  coolant_passage_heat_transfer_tier_ratio: 1.71175
  # Heat capacity (HU/°C) of a tier-0 passage; a passage of voltage tier t holds 2^t times this.
  coolant_passage_heat_capacity: 16.0
  # Conductance (HU/(s·°C)) from a nuclear core hatch into its coolant: base_hatch_conductance at MV, times
  # hatch_conductance_tier_ratio per tier above. Heat capacity doubles per tier, so a ratio above 2 lets higher tiers
  # remove a larger share of their excess heat: by default 20%/s at EV, rising to 60%/s at UHV.
  base_hatch_conductance: 8.12
  hatch_conductance_tier_ratio: 2.65
  # Heat capacity (HU/°C) of a tier-0 nuclear core hatch; a hatch of tier t holds 2^t times this (LV 32, EV 256,
  # UV 4096), as its tank holds 8000 L times 2^t. Buses and other core tiles hold hu_per_degree.
  core_hatch_heat_capacity: 16.0
  coolant_passage_conduction: 0.9
  coolant_passage_scattering: 0.8
  coolant_passage_fast_absorption: 0.02
  coolant_passage_thermal_absorption: 0.05
  coolant_passage_default_moderation: 0.05
  coolant_passage_neutrons_per_radiolysis: 4
  coolant_passage_minor_loss_k: 2.5
  boundary_heat_loss: 0.02
  radiation_decay_factor: 0.95
  doppler_deficit_exponent: 1.2
  wall_reflection_chance: 0.0
  wall_maintenance_neutron_threshold: 10000
  default_ambient_temp: 293.15
  # Beam packets a second per keV of beam energy and particle of beam rate; each packet is 4 fast neutrons.  A
  # Source Chamber burning Californium dust from an EV hatch (1,920 EU/t, a 9,000 keV beam at rate 10) then drives
  # 18,000 fast neutrons a second.  A balance lever: beams are a neutron source for driving and irradiating fuel,
  # paid for in the item they burn and a ZPM-tier chamber; a reactor without fuel must not beat a simple ZPM design
  # on one.
  beam_energy_to_fast_neutron_multiplier: 0.05
  t10_wear_factor: 8.0
  dense_nbase_multiplier: 0.36332
  dense_fission_multiplier: 2.24009
  excited_nbase_multiplier: 0.755552
  excited_fission_multiplier: 0.658573
  standard_nbase_multiplier: 0.565854
  standard_fission_multiplier: 1.76819
  breeder_nbase_multiplier: 1.0
  breeder_fission_multiplier: 1.0

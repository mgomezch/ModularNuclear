# ==========================================================================
# Coolant Loops: Thermodynamic Fluid Properties
# All units are standard SI (kg/m^3, Pa*s, J/(kg*K), W/(m*K), deg C)
# Each entry is keyed by the fluid's exact registry name (fluidName), as /fluids or NEI shows it
# ==========================================================================

fluids:
  water:
    fluidName: "water"
    density: 1000.0
    dynamicViscosity: 0.001
    specificHeat: 4184.0
    thermalConductivity: 0.606
    boilingPointCelsius: 100.0
    freezingPointCelsius: 0.0
    isMolten: false
    radiolysisMultiplier: 1.0
    spillOnRupture: true

